[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeal"
version = "0.11.0rc1"
description = "Open-source, local-first intelligence, company research, and valuation platform."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "OpenDeal Contributors" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
]

[project.scripts]
opendeal = "opendeal.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opendeal.ui" = [
    "templates/*.html",
    "templates/**/*.html",
    "static/css/*",
    "static/js/*",
    "static/**/*",
]
"opendeal.valuation" = [
    "verified_mappings.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as an asyncio coroutine",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
]
